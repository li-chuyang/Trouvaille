<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-labelledby="title desc">
  <title id="title">Trouvaille</title>
  <desc id="desc">Trouvaille coding agent logo with a compass-shaped mark</desc>
  <defs>
    <linearGradient id="mark" x1="24" y1="20" x2="204" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="spark" x1="74" y1="64" x2="160" y2="169" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ECFEFF"/>
      <stop offset="1" stop-color="#A5F3FC"/>
    </linearGradient>
    <style>
      @media (prefers-color-scheme: dark) {
        #wordmark { fill: #F8FAFC; }
        #tagline { fill: #94A3B8; }
      }
    </style>
  </defs>

  <g transform="translate(12 12)">
    <rect width="216" height="216" rx="54" fill="#0F172A"/>
    <path d="M108 25 131 85 191 108 131 131 108 191 85 131 25 108 85 85Z" fill="url(#mark)"/>
    <circle cx="108" cy="108" r="36" fill="#0F172A" stroke="url(#spark)" stroke-width="8"/>
    <path d="m126 77-11 38-38 11 24-25Z" fill="url(#spark)"/>
    <circle cx="108" cy="108" r="7" fill="#F8FAFC"/>
  </g>

  <text id="wordmark" x="266" y="126" fill="#0F172A" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="88" font-weight="720" letter-spacing="-3">Trouvaille</text>
  <text id="tagline" x="272" y="170" fill="#64748B" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="500" letter-spacing="4">LOCAL CODING AGENT</text>
</svg>
