[project]
name = "trouvaille"
version = "0.1.0"
description = "A minimal coding agent with an explicit model-tool loop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.17.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
trouvaille = "trouvaille.cli:main"

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "trouvaille"
